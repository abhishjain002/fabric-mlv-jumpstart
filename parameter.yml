find_replace:
  # Replace default_lakehouse GUID in notebook metadata
  - find_value: \#\s*META\s+"default_lakehouse":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"
    replace_value:
      _ALL_: "$items.Lakehouse.mlv_lakehouse.$id"
    is_regex: "true"
    item_type: "Notebook"
    item_name: ["mlv_get_started"]

  # Replace default_lakehouse_workspace_id GUID in notebook metadata
  - find_value: \#\s*META\s+"default_lakehouse_workspace_id":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"
    replace_value:
      _ALL_: "$workspace.$id"
    is_regex: "true"
    item_type: "Notebook"
    item_name: ["mlv_get_started"]

  # Replace lakehouse GUID in known_lakehouses array
  - find_value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    replace_value:
      _ALL_: "$items.Lakehouse.mlv_lakehouse.$id"
    item_type: "Notebook"
